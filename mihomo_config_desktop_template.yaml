# Mihomo (Clash Meta) 配置文件
# 模式：白名单模式 (默认代理，未明确命中的流量全部走代理)

mixed-port: 7890
allow-lan: false
external-controller:
external-controller-cors:
  allow-private-network: true
  allow-origins:
    - https://yacd.metacubex.one
    - https://metacubex.github.io
    - https://board.zash.run.place

unified-delay: true

profile:
  store-selected: true

tun:
  enable: true
  auto-route: true
  auto-detect-interface: true
  stack: gvisor
  dns-hijack:
    - any:53

sniffer:
  enable: true
  sniff:
    tls:
      ports: [443, 8443]
    http:
      ports: [80, 8080-8880]

mode: rule
log-level: info

# DNS 配置 (可根据自身需求微调)
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '*.msftncsi.com'
    - 'www.msftconnecttest.com'
  nameserver:
    - 223.5.5.5
    - 114.114.114.114

# 节点订阅配置
# interval 单位为秒，1440分钟 = 86400秒
proxy-providers:
  sub_nodes_1:
    type: http
    url: "YOUR_SUBSCRIPTION_LINK_HERE"
    path: ./proxy_providers/sub_nodes_1.yaml
    interval: 86400
    # 利用正则过滤掉名称包含香港相关字眼的节点 (使用 (?i) 忽略大小写)
    exclude-filter: "(?i)香港|HK|HongKong|Hong Kong|过滤|剩余|套餐"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

  sub_nodes_2:
    type: http
    url: "YOUR_SUBSCRIPTION_LINK_HERE"
    path: ./proxy_providers/sub_nodes_2.yaml
    interval: 86400
    # 利用正则过滤掉名称包含香港相关字眼的节点 (使用 (?i) 忽略大小写)
    exclude-filter: "(?i)香港|HK|HongKong|Hong Kong|过滤|剩余|套餐"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# 代理组配置
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - ROUTE_GLOBAL
      - ROUTE_AI
      - ROUTE_SPEED
      - AUTO_STRICT
      - AUTO_SPEED
      - AUTO_GENERAL
    use:
      - sub_nodes_1
      - sub_nodes_2

  - name: ROUTE_AI
    type: fallback
    proxies:
      - AUTO_STRICT
      - AUTO_SPEED
      - AUTO_GENERAL
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: ROUTE_SPEED
    type: fallback
    proxies:
      - AUTO_SPEED
      - AUTO_STRICT
      - AUTO_GENERAL
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: ROUTE_GLOBAL
    type: fallback
    proxies:
      - AUTO_GENERAL
      - AUTO_SPEED
      - AUTO_STRICT
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AUTO_STRICT
    type: url-test
    use:
      - sub_nodes_1
      - sub_nodes_2
    # 强对抗场景 (VLESS, Trojan, Snell) - 排除其它
    exclude-type: "Shadowsocks|ShadowsocksR|Vmess|Http|Socks|Socks5|WireGuard|Tuic|Hysteria|Hysteria2"
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AUTO_SPEED
    type: url-test
    use:
      - sub_nodes_1
      - sub_nodes_2
    # 低延迟加速场景 (SS, SSR, Hysteria/2, TUIC, Wireguard) - 排除其它
    exclude-type: "Vless|Trojan|Snell|Vmess|Http|Socks|Socks5"
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AUTO_GENERAL
    type: url-test
    use:
      - sub_nodes_1
      - sub_nodes_2
    # 兜底备用场景 (VMess, HTTP, Socks) - 排除其它
    exclude-type: "Vless|Trojan|Snell|Shadowsocks|ShadowsocksR|WireGuard|Tuic|Hysteria|Hysteria2"
    url: http://www.gstatic.com/generate_204
    interval: 300

# 规则订阅配置 (Loyalsoldier - 全量引入)
# interval 单位为秒，86400秒
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./rule_providers/reject.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt"
    path: ./rule_providers/icloud.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt"
    path: ./rule_providers/apple.yaml
    interval: 86400

  google:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/google.txt"
    path: ./rule_providers/google.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"
    path: ./rule_providers/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
    path: ./rule_providers/direct.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"
    path: ./rule_providers/private.yaml
    interval: 86400

  gfw:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/gfw.txt"
    path: ./rule_providers/gfw.yaml
    interval: 86400

  tld-not-cn:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/tld-not-cn.txt"
    path: ./rule_providers/tld-not-cn.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"
    path: ./rule_providers/telegramcidr.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"
    path: ./rule_providers/cncidr.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt"
    path: ./rule_providers/lancidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt"
    path: ./rule_providers/applications.yaml
    interval: 86400

  cloudflare:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Cloudflare/Cloudflare.yaml"
    path: ./rule_providers/cloudflare.yaml
    interval: 86400

# 路由规则 (白名单模式匹配)
rules:
  # 0. 阻断 QUIC (强制浏览器 fallback 到 TCP)
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  # 1. 优先放行特殊流量及局域网直连
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT
  
  # 2. 拦截广告和恶意域名
  - RULE-SET,reject,REJECT
  
  # 3. 常见大厂服务直连 / 代理分配
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,ROUTE_AI  # Google、Gemini 对 IP 极度敏感，走高可用 AI 路由
  
  # 4. 匹配 Loyalsoldier 规则中的代理名单 (黑名单触发点)
  - RULE-SET,proxy,ROUTE_AI   # 混杂 Copilot 等 AI 域名，走高可用 AI 路由
  - RULE-SET,gfw,ROUTE_AI     # 同上，确保极高可用性
  - RULE-SET,tld-not-cn,PROXY    # 普通外网流量，交回给可干预的 PROXY 组
  - RULE-SET,telegramcidr,ROUTE_SPEED   # TG 低延迟及 UDP，走高可用加速路由
  
  # 5. 国内服务直连名单
  - RULE-SET,direct,DIRECT
  - RULE-SET,cncidr,DIRECT
  
  # 6. 补充 GeoData 规则 (利用本地 geoip.metadb 和 GeoSite.dat)
  - GEOSITE,gfw,ROUTE_AI
  - GEOIP,telegram,ROUTE_SPEED
  - RULE-SET,cloudflare,PROXY
  - GEOSITE,CN,DIRECT
  - GEOIP,lan,DIRECT
  - GEOIP,CN,DIRECT
  
  # 7. 兜底规则: 未命中上述所有规则的流量默认走代理 (这就是白名单模式的核心)
  - MATCH,PROXY


