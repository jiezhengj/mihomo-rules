# 路由规则 (白名单模式匹配)
rules:
  # 0. 阻断 QUIC (强制浏览器 fallback 到 TCP)
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 1. 优先放行特殊流量及局域网直连
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT
  - GEOIP,lan,DIRECT

  # 2. 拦截广告和恶意域名
  - RULE-SET,reject,REJECT

  # 3. 常见大厂基础服务直连
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT

  # 4. 国内服务直连名单 (提权至 CDN 之前，确保国内服务绝对直连不误伤)
  - RULE-SET,direct,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT

  # 4.1 系统 OTA 固件更新直连 (避免耗费代理流量)
  - RULE-SET,system_ota,DIRECT

  # 5. 静态大流量 / CDN / 流媒体音视频 (走 ROUTE_GLOBAL 策略组，首选常规/低倍率节点并具备容灾 fallback)
  - RULE-SET,sukka_cdn_domain,ROUTE_GLOBAL
  - RULE-SET,sukka_cdn_non_ip,ROUTE_GLOBAL
  - RULE-SET,cloudflare,ROUTE_GLOBAL
  - RULE-SET,global_media,ROUTE_GLOBAL

  # 6. 敏感高可用业务与 AIGC 生产力 (走纯净稳健节点 ROUTE_AI)
  - RULE-SET,sukka_ai,ROUTE_AI
  - RULE-SET,google,ROUTE_AI

  # 7. 低延迟通信与加速业务 (走 ROUTE_SPEED)
  - RULE-SET,telegramcidr,ROUTE_SPEED
  - GEOIP,telegram,ROUTE_SPEED

  # 8. 境外常规被阻断站点 (释放至 ROUTE_GLOBAL，优先常规节点并具备容灾)
  - RULE-SET,proxy,ROUTE_GLOBAL
  - RULE-SET,gfw,ROUTE_GLOBAL
  - GEOSITE,gfw,ROUTE_GLOBAL
  - RULE-SET,tld-not-cn,PROXY  # 非中国顶级域名走代理

  # 9. 兜底规则: 未命中上述所有规则的流量默认走代理 (白名单模式核心)
  - MATCH,PROXY
