# Mihomo (Clash Meta) 配置文件
# 模式：白名单模式 (默认代理，未明确命中的流量全部走代理)
# 架构：单机场 (Single Provider) 精简版

mixed-port: 7890
allow-lan: false

unified-delay: true

profile:
  store-selected: true

tun:
  enable: true
  auto-route: true
  auto-detect-interface: true
  stack: gvisor
  dns-hijack:
    - any:53

sniffer:
  enable: true
  sniff:
    tls:
      ports: [443, 8443]
    http:
      ports: [80, 8080-8880]

mode: rule
log-level: info

# DNS 配置 (可根据自身需求微调)
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '*.msftncsi.com'
    - 'www.msftconnecttest.com'
  nameserver:
    - 223.5.5.5
    - 114.114.114.114

# 节点订阅配置
# interval 单位为秒，1440分钟 = 86400秒
proxy-providers:
  sub_nodes:
    type: http
    url: "YOUR_SUBSCRIPTION_LINK_HERE"
    path: ./proxy_providers/sub_nodes.yaml
    interval: 86400
    # 利用正则过滤掉名称包含香港相关字眼的节点 (使用 filter 和负向先行断言以兼容 iOS)
    filter: "(?i)^(?!.*(香港|HK|HongKong|Hong Kong|过滤|剩余|套餐)).*$"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# 代理组配置
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - ROUTE_GLOBAL
      - ROUTE_AI
      - ROUTE_SPEED
      - AUTO_STRICT
      - AUTO_SPEED
      - AUTO_GENERAL
    use:
      - sub_nodes

  - name: ROUTE_AI
    type: fallback
    proxies:
      - AUTO_STRICT
      - AUTO_SPEED
      - AUTO_GENERAL
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: ROUTE_SPEED
    type: fallback
    proxies:
      - AUTO_SPEED
      - AUTO_STRICT
      - AUTO_GENERAL
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: ROUTE_GLOBAL
    type: fallback
    proxies:
      - AUTO_GENERAL
      - AUTO_SPEED
      - AUTO_STRICT
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AUTO_STRICT
    type: url-test
    use:
      - sub_nodes
    # 强对抗场景 (VLESS, Trojan, Snell) - 排除其它
    exclude-type: "Shadowsocks|ShadowsocksR|Vmess|Http|Socks|Socks5|WireGuard|Tuic|Hysteria|Hysteria2"
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AUTO_SPEED
    type: url-test
    use:
      - sub_nodes
    # 低延迟加速场景 (SS, SSR, Hysteria/2, TUIC, Wireguard) - 排除其它
    exclude-type: "Vless|Trojan|Snell|Vmess|Http|Socks|Socks5"
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AUTO_GENERAL
    type: url-test
    use:
      - sub_nodes
    # 兜底备用场景 (VMess, HTTP, Socks) - 排除其它
    exclude-type: "Vless|Trojan|Snell|Shadowsocks|ShadowsocksR|WireGuard|Tuic|Hysteria|Hysteria2"
    url: http://www.gstatic.com/generate_204
    interval: 300

# 规则订阅配置 (Loyalsoldier - 全量引入)
