  telegramcidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/telegramcidr.txt"
    path: ./rule_providers/telegramcidr.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt"
    path: ./rule_providers/cncidr.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt"
    path: ./rule_providers/lancidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt"
    path: ./rule_providers/applications.yaml
    interval: 86400

# 路由规则 (白名单模式匹配)
rules:
  # 0. 阻断 QUIC (强制浏览器 fallback 到 TCP)
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 1. 优先放行特殊流量及局域网直连
  - RULE-SET,applications,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT
  - GEOIP,lan,DIRECT

  # 2. 拦截广告和恶意域名
  - RULE-SET,reject,REJECT

  # 3. 常见大厂服务直连 / 代理分配
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,PROXY  # Google 通常需要代理

  # 4. 国内服务直连名单 (提权至 CDN 之前，确保国内服务绝对直连不误伤)
  - RULE-SET,direct,DIRECT
  - RULE-SET,cncidr,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT

  # 5. 静态大流量 / CDN 分流 (统一走 PROXY 策略组调度)
  - RULE-SET,sukka_cdn_domain,PROXY
  - RULE-SET,sukka_cdn_non_ip,PROXY
  - RULE-SET,cloudflare,PROXY

  # 6. 匹配 Loyalsoldier 规则中的代理名单 (黑名单触发点)
  - RULE-SET,proxy,PROXY
  - RULE-SET,gfw,PROXY
  - GEOSITE,gfw,PROXY
  - RULE-SET,tld-not-cn,PROXY  # 非中国顶级域名走代理
  - RULE-SET,telegramcidr,PROXY
  - GEOIP,telegram,PROXY

  # 7. 兜底规则: 未命中上述所有规则的流量默认走代理 (白名单模式核心)
  - MATCH,PROXY
