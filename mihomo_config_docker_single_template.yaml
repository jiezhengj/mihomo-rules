# Mihomo (Clash Meta) 配置文件
# 模式：白名单模式 (默认代理，未明确命中的流量全部走代理)
# 架构：单机场 (Single Provider) 精简版

mixed-port: 7890
allow-lan: true
external-controller: 0.0.0.0:9090

unified-delay: true

profile:
  store-selected: true

tun:
  enable: false
  auto-route: true
  auto-detect-interface: true
  stack: gvisor
  dns-hijack:
    - any:53

mode: rule
log-level: info

# 本地Hosts配置
hosts:
  your-private-domain.com: 192.168.x.x

# DNS 配置 (可根据自身需求微调)
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.market.xiaomi.com'
    - 'localhost.ptlogin2.qq.com'
    - '*.msftncsi.com'
    - 'www.msftconnecttest.com'
  nameserver:
    - 223.5.5.5
    - 114.114.114.114

# 节点订阅配置
# interval 单位为秒，1440分钟 = 86400秒
proxy-providers:
  sub_nodes:
    type: http
    url: "YOUR_SUBSCRIPTION_LINK_HERE"
    path: ./proxy_providers/sub_nodes.yaml
    interval: 86400
    # 利用正则过滤掉名称包含香港相关字眼的节点 (使用 (?i) 忽略大小写)
    exclude-filter: "(?i)香港|HK|HongKong|Hong Kong|过滤|剩余|套餐"
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# 代理组配置
proxy-groups:
  - name: PROXY
    type: select
    use:
      - sub_nodes
    proxies:
      - AUTO

  - name: AUTO
    type: url-test
    use:
      - sub_nodes
    url: http://www.gstatic.com/generate_204
    interval: 300

# 规则订阅配置 (Loyalsoldier - 全量引入)
# interval 单位为秒，86400秒
rule-providers:
  sukka_cdn_domain:
    type: http
    behavior: domain
    format: text
    url: "https://ruleset.skk.moe/Clash/domainset/cdn.txt"
    path: ./rule_providers/sukka_cdn_domain.txt
    interval: 86400

  sukka_cdn_non_ip:
    type: http
    behavior: classical
    format: text
    url: "https://ruleset.skk.moe/Clash/non_ip/cdn.txt"
    path: ./rule_providers/sukka_cdn_non_ip.txt
    interval: 86400

  cloudflare:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Cloudflare/Cloudflare.yaml"
    path: ./rule_providers/cloudflare.yaml
    interval: 86400

  reject:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./rule_providers/reject.yaml
