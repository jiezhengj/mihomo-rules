# Mihomo (Clash Meta) 配置 — Android / 单机场 / 公开模板
#
#
# 路由判定链（自上而下首匹配）：
#   1. 应当拦截？-> REJECT   2. 不应翻墙？-> DIRECT
#   3. 需翻墙 + 普通流量？-> AUTO   4. 需翻墙 + 大流量？-> AUTO
#   5. 其余 -> MATCH,PROXY
#

mixed-port: 7890
allow-lan: false


unified-delay: true
mode: rule

profile:
  store-selected: true

tun:
  enable: true
  auto-route: true
  auto-detect-interface: true
  stack: gvisor
  dns-hijack:
    - any:53

sniffer:
  enable: true
  override-destination: false
  sniff:
    tls:
      ports: [443, 8443]
    http:
      ports: [80, 8080-8880]

dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - 'localhost.ptlogin2.qq.com'
    - '*.msftncsi.com'
    - 'www.msftconnecttest.com'

  nameserver:
    - 223.5.5.5
    - 114.114.114.114

# 节点订阅（公开模板仅用占位符）
proxy-providers:
  sub_nodes:
    type: http
    url: "YOUR_SUBSCRIPTION_LINK_HERE"
    path: ./proxy_providers/sub_nodes.yaml
    interval: 86400
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
  # 手动逃生口 + 最终兜底
  - name: PROXY
    type: select
    proxies:
      - AUTO
    use:
      - sub_nodes

  # 节点池，自动选优。业务规则直接指向它。
  # 模板只有一个池，故不设 AUTO / AUTO 中间层——两个都指向同一池是冗余。
  # 若订阅有大流量节点池（按节点名识别），参照个人配置拆成 AUTO_STRICT / AUTO_GENERAL，
  # 再把规则改指 AUTO / AUTO。
  - name: AUTO
    type: url-test
    use:
      - sub_nodes
    url: http://www.gstatic.com/generate_204
    interval: 300

# 以下资源全部取自 MetaCubeX/meta-rules-dat，固定到同一 commit
rule-providers:
  # —— 拦截 ——
  category_ads_all:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
    path: ./rule_providers/category-ads-all.mrs
    interval: 86400
  # —— 不翻墙 ——
  private_domain:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
    path: ./rule_providers/private-domain.mrs
    interval: 86400
  private_ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"
    path: ./rule_providers/private-ip.mrs
    interval: 86400
  geo_cn_ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
    path: ./rule_providers/geo-cn-ip.mrs
    interval: 86400
  # 国内可用系统服务
  apple:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"
    path: ./rule_providers/apple.mrs
    interval: 86400
  # 国内可用系统服务
  microsoft:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"
    path: ./rule_providers/microsoft.mrs
    interval: 86400
  # 境内域名全集，含 +.cn 等注册域（非 geolocation-cn 那个窄集合）
  cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: ./rule_providers/cn.mrs
    interval: 86400
  # —— 需翻墙 + 普通流量 ——
  ai_chat:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-chat-!cn.mrs"
    path: ./rule_providers/ai-chat.mrs
    interval: 86400
  google:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"
    path: ./rule_providers/google.mrs
    interval: 86400
  # —— 需翻墙 + 大流量 ——
  media:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-media.mrs"
    path: ./rule_providers/media.mrs
    interval: 86400
  # 社交图片视频（含 twimg / twvid / fbcdn）
  social_media_nc:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-social-media-!cn.mrs"
    path: ./rule_providers/social-media.mrs
    interval: 86400
  # 网盘与文件同步
  netdisk_nc:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-netdisk-!cn.mrs"
    path: ./rule_providers/netdisk.mrs
    interval: 86400
  # —— 需翻墙主体 ——
  gfw:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/gfw.mrs"
    path: ./rule_providers/gfw.mrs
    interval: 86400
  # —— CDN 静态/媒体（域名层）——
  cdn_nc:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-cdn-!cn.mrs"
    path: ./rule_providers/cdn-nc.mrs
    interval: 86400
  cdn_akamai:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/akamai.mrs"
    path: ./rule_providers/cdn-akamai.mrs
    interval: 86400
  cdn_fastly:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/fastly.mrs"
    path: ./rule_providers/cdn-fastly.mrs
    interval: 86400
  # —— CDN IP 层（iOS 因 15MB 内存约束不引入）——
  cdn_ip_cloudflare:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cloudflare.mrs"
    path: ./rule_providers/cdn-ip-cloudflare.mrs
    interval: 86400
  cdn_ip_cloudfront:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cloudfront.mrs"
    path: ./rule_providers/cdn-ip-cloudfront.mrs
    interval: 86400
  cdn_ip_fastly:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/fastly.mrs"
    path: ./rule_providers/cdn-ip-fastly.mrs
    interval: 86400

rules:
  # 1) 拦截
  - RULE-SET,category_ads_all,REJECT

  # 2) 不翻墙
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,geo_cn_ip,DIRECT,no-resolve

  # 3) 阻断常规浏览器 QUIC，强制回落 TCP
  #    否则抓不到 TLS SNI，域名规则无法匹配。
  #    排在个人例外之后，使 UDP 打洞类流量不被误杀。
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 4) 需翻墙主体 -> AUTO
  - RULE-SET,gfw,AUTO

  # 5) 境内域名 -> DIRECT
  #    必须在 gfw 之后：gfw 有 22 条受限站点被 cn 覆盖（futu.cn / longbridge.cn / google.cn 等）。
  #    必须在大流量层之前：media / social / cdn 合计 46 条境内服务被 cn 覆盖，应直连。
  - RULE-SET,cn,DIRECT

  # 6) 需翻墙 + 普通流量 -> AUTO（首选纯净节点）
  #    排在 cn 之后：google 有 15 条 -cn 国内基建应直连。
  - RULE-SET,ai_chat,AUTO
  - RULE-SET,google,AUTO

  # 7) 需翻墙 + 大流量 -> AUTO
  - RULE-SET,media,AUTO
  - RULE-SET,social_media_nc,AUTO
  - RULE-SET,netdisk_nc,AUTO

  # 8) 国内可用系统服务 -> DIRECT
  #    apple 含 apple-update（21/21 全覆盖），无需单列。
  #    microsoft 不覆盖 win-update 全集，故 win_update 单列（见上）。
  #    置于 gfw 之后：apple / microsoft 与 gfw 的 1 / 17 条交叠保持代理。
  - RULE-SET,apple,DIRECT
  - RULE-SET,microsoft,DIRECT

  # 9) CDN 静态与媒体 -> AUTO
  #    域名层抓 fake-ip 下的域名连接；IP 层抓 IP 直连与已解析连接，两者缺一不可。
  - RULE-SET,cdn_nc,AUTO
  - RULE-SET,cdn_akamai,AUTO
  - RULE-SET,cdn_fastly,AUTO

  - RULE-SET,cdn_ip_cloudflare,AUTO,no-resolve
  - RULE-SET,cdn_ip_cloudfront,AUTO,no-resolve
  - RULE-SET,cdn_ip_fastly,AUTO,no-resolve
  # 10) 兜底
  - MATCH,PROXY
