# Mihomo (Clash Meta) 配置 — iOS / 双机场 / 公开模板
#
#
# 路由判定链（自上而下首匹配）：
#   1. 应当拦截？-> REJECT   2. 不应翻墙？-> DIRECT
#   3. 需翻墙 + 普通流量？-> AUTO   4. 需翻墙 + 大流量？-> AUTO
#   5. 其余 -> MATCH,PROXY
#

mixed-port: 7890
allow-lan: false


unified-delay: true
mode: rule

profile:
  store-selected: true

dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.arpa'
    - 'time.*.com'
    - 'ntp.*.com'
    - 'localhost.ptlogin2.qq.com'
    - '*.msftncsi.com'
    - 'www.msftconnecttest.com'

  nameserver:
    - 223.5.5.5
    - 114.114.114.114

# 节点订阅（公开模板仅用占位符）
proxy-providers:
  sub_nodes_1:
    type: http
    url: "YOUR_SUBSCRIPTION_LINK_HERE"
    path: ./proxy_providers/sub_nodes_1.yaml
    interval: 86400
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
  sub_nodes_2:
    type: http
    url: "YOUR_SUBSCRIPTION_LINK_HERE"
    path: ./proxy_providers/sub_nodes_2.yaml
    interval: 86400
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
  # 手动逃生口 + 最终兜底
  - name: PROXY
    type: select
    proxies:
      - AUTO
      - AUTO_1
      - AUTO_2
    use:
      - sub_nodes_1
      - sub_nodes_2

  # 节点池，自动选优。业务规则直接指向它。
  # 模板只有一个池，故不设 AUTO / AUTO 中间层——两个都指向同一池是冗余。
  # 若订阅有大流量节点池（按节点名识别），参照个人配置拆成 AUTO_STRICT / AUTO_GENERAL，
  # 再把规则改指 AUTO / AUTO。
  - name: AUTO
    type: url-test
    use:
      - sub_nodes_1
      - sub_nodes_2
    url: http://www.gstatic.com/generate_204
    interval: 300

  # 双机场独立逃生入口
  - name: AUTO_1
    type: url-test
    use:
      - sub_nodes_1
    url: http://www.gstatic.com/generate_204
    interval: 300

  - name: AUTO_2
    type: url-test
    use:
      - sub_nodes_2
    url: http://www.gstatic.com/generate_204
    interval: 300

# 以下资源全部取自 MetaCubeX/meta-rules-dat，固定到同一 commit
rule-providers:
  # —— 拦截 ——
  category_ads_all:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/category-ads-all.yaml"
    path: ./rule_providers/category-ads-all.yaml
    interval: 86400
  # —— 不翻墙 ——
  private_domain:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/private.yaml"
    path: ./rule_providers/private-domain.yaml
    interval: 86400
  private_ip:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geoip/private.yaml"
    path: ./rule_providers/private-ip.yaml
    interval: 86400
  geo_cn_ip:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geoip/cn.yaml"
    path: ./rule_providers/geo-cn-ip.yaml
    interval: 86400
  # 国内可用系统服务
  apple:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/apple.yaml"
    path: ./rule_providers/apple.yaml
    interval: 86400
  # 国内可用系统服务
  microsoft:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/microsoft.yaml"
    path: ./rule_providers/microsoft.yaml
    interval: 86400
  # 境内域名全集，含 +.cn 等注册域（非 geolocation-cn 那个窄集合）
  cn:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/cn.yaml"
    path: ./rule_providers/cn.yaml
    interval: 86400
  # —— 需翻墙 + 普通流量 ——
  ai_chat:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/category-ai-chat-!cn.yaml"
    path: ./rule_providers/ai-chat.yaml
    interval: 86400
  google:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/google.yaml"
    path: ./rule_providers/google.yaml
    interval: 86400
  # —— 需翻墙 + 大流量 ——
  media:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/category-media.yaml"
    path: ./rule_providers/media.yaml
    interval: 86400
  # 社交图片视频（含 twimg / twvid / fbcdn）
  social_media_nc:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/category-social-media-!cn.yaml"
    path: ./rule_providers/social-media.yaml
    interval: 86400
  # 网盘与文件同步
  netdisk_nc:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/category-netdisk-!cn.yaml"
    path: ./rule_providers/netdisk.yaml
    interval: 86400
  # —— 需翻墙主体 ——
  gfw:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/gfw.yaml"
    path: ./rule_providers/gfw.yaml
    interval: 86400
  # —— CDN 静态/媒体（域名层）——
  cdn_nc:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/category-cdn-!cn.yaml"
    path: ./rule_providers/cdn-nc.yaml
    interval: 86400
  cdn_akamai:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/akamai.yaml"
    path: ./rule_providers/cdn-akamai.yaml
    interval: 86400
  cdn_fastly:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/cb3e075825906a4dcc2feff84e3d6cc5691d9416/geo/geosite/fastly.yaml"
    path: ./rule_providers/cdn-fastly.yaml
    interval: 86400

rules:
  # 1) 拦截
  - RULE-SET,category_ads_all,REJECT

  # 2) 不翻墙
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,geo_cn_ip,DIRECT,no-resolve

  # 3) 阻断常规浏览器 QUIC，强制回落 TCP
  #    否则抓不到 TLS SNI，域名规则无法匹配。
  #    排在个人例外之后，使 UDP 打洞类流量不被误杀。
  #    [iOS 暂停] AND 逻辑规则是 Mihomo/Clash Premium 扩展，Stash 是否支持未证实。
  #    保守起见先注释；若实测可用，取消注释即可。
  # - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT

  # 4) 需翻墙主体 -> AUTO
  - RULE-SET,gfw,AUTO

  # 5) 境内域名 -> DIRECT
  #    必须在 gfw 之后：gfw 有 22 条受限站点被 cn 覆盖（futu.cn / longbridge.cn / google.cn 等）。
  #    必须在大流量层之前：media / social / cdn 合计 46 条境内服务被 cn 覆盖，应直连。
  - RULE-SET,cn,DIRECT

  # 6) 需翻墙 + 普通流量 -> AUTO（首选纯净节点）
  #    排在 cn 之后：google 有 15 条 -cn 国内基建应直连。
  - RULE-SET,ai_chat,AUTO
  - RULE-SET,google,AUTO

  # 7) 需翻墙 + 大流量 -> AUTO
  - RULE-SET,media,AUTO
  - RULE-SET,social_media_nc,AUTO
  - RULE-SET,netdisk_nc,AUTO

  # 8) 国内可用系统服务 -> DIRECT
  #    apple 含 apple-update（21/21 全覆盖），无需单列。
  #    microsoft 不覆盖 win-update 全集，故 win_update 单列（见上）。
  #    置于 gfw 之后：apple / microsoft 与 gfw 的 1 / 17 条交叠保持代理。
  - RULE-SET,apple,DIRECT
  - RULE-SET,microsoft,DIRECT

  # 9) CDN 静态与媒体 -> AUTO
  #    域名层抓 fake-ip 下的域名连接；IP 层抓 IP 直连与已解析连接，两者缺一不可。
  - RULE-SET,cdn_nc,AUTO
  - RULE-SET,cdn_akamai,AUTO
  - RULE-SET,cdn_fastly,AUTO

  # 10) 兜底
  - MATCH,PROXY
